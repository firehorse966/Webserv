<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Uploads</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 800px;
      margin: auto;
      padding: 2rem;
    }
    h1 { text-align: center; }
    form {
      margin-bottom: 2rem;
      border: 1px solid #ccc;
      padding: 1rem;
      border-radius: 5px;
      background: #f9f9f9;
    }
    form input[type="file"] {
      display: block;
      margin-bottom: 1rem;
    }
    .view-uploads {
      text-align: center;
      margin-top: 1rem;
    }
    .view-uploads a {
      display: inline-block;
      background: #007bff;
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      text-decoration: none;
    }
    .view-uploads a:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <h1>File Uploads</h1>

  <form id="upload-form" action="/cgi-bin/upload.py" method="POST" enctype="multipart/form-data">
    <label for="file-input">Choose file to upload:</label>
    <input type="file" id="file-input" name="uploadFile" required>
    <button type="submit">Upload</button>
  </form>

  <div class="view-uploads">
    <a href="/uploads/" target="_blank">View Uploaded Files</a>
  </div>

  <script>
    document.getElementById('upload-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const form = e.currentTarget;
      const data = new FormData(form);
      const res = await fetch(form.action, {
        method: 'POST',
        body: data
      });
      if (res.ok) {
        form.reset();
        alert('Upload successful! Click "View Uploaded Files" to review.');
      } else {
		const errorPage = await res.text();
        document.open();
        document.write(errorPage);
        document.close();
        //alert('Upload failed.');
    }
    });
  </script>
</body>
</html>
